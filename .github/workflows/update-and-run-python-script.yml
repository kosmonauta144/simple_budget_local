name: Update and run Python script

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-python-runner
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: self-hosted

    steps:
      - name: Download latest main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Check Python version
        run: python3 --version

      - name: Install dependencies
        run: |
          python3 -m pip install -r requirements.txt

      - name: Run Python script
        run: python3 server.py