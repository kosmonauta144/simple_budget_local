name: Update and run Python script

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ubuntu-python-runner
  cancel-in-progress: false

jobs:
  run-script:
    runs-on: self-hosted

    steps:
      - name: Download latest main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true

      - name: Check Python version
        run: python3 --version

      - name: Deploy application files
        run: |
          service_dir=/home/marabir/budget/simple_budget_local
          sudo install -d "$service_dir/static"
          sudo cp server.py "$service_dir/server.py"
          sudo cp -R static/. "$service_dir/static/"

      - name: Restart systemd service
        run: sudo systemctl restart simple-budget.service